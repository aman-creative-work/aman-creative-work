<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Design Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        
        .view-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tap-card:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-center relative">
            <button id="backBtn" class="absolute left-4 text-slate-500 hover:text-blue-600 hidden p-2" onclick="goBack()">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button>
            <h1 class="text-xl font-bold text-blue-600 tracking-tight">Creative Design Services</h1>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 mt-6">

        <!-- STEP 1: Categories View -->
        <div id="view-categories" class="view-section active">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Choose Your Business</h2>
                <p class="text-slate-500 text-sm mt-1">Select your category to see our design services</p>
            </div>

            <!-- Categories Grid -->
            <div id="categories-grid" class="grid grid-cols-2 gap-3 sm:gap-4">
                <!-- Data injected via JS -->
            </div>

            <!-- Special Packages Section -->
            <div class="mt-10 mb-6">
                <div class="flex items-center gap-2 mb-4">
                    <span class="text-xl">🔥</span>
                    <h2 class="text-xl font-bold text-slate-900">Special Packages</h2>
                </div>
                <div id="packages-list" class="space-y-4">
                    <!-- Data injected via JS -->
                </div>
            </div>
        </div>

        <!-- STEP 2: Services View -->
        <div id="view-services" class="view-section">
            <div class="mb-6">
                <span id="selected-category-title" class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded mb-2">Category Name</span>
                <h2 class="text-2xl font-bold text-slate-900">Select a Service</h2>
            </div>

            <div id="services-list" class="space-y-3">
                <!-- Data injected via JS -->
            </div>
        </div>

        <!-- STEP 3: Form View -->
        <div id="view-form" class="view-section">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Customer Details</h2>
                <p class="text-slate-500 text-sm mt-1">Enter details to send requirement on WhatsApp</p>
            </div>

            <!-- Order Summary -->
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6">
                <h3 class="text-sm font-semibold text-blue-800 mb-3 border-b border-blue-200 pb-2">Order Summary</h3>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-600 text-sm">Category:</span>
                    <span id="summary-category" class="font-medium text-slate-900">...</span>
                </div>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-600 text-sm">Service:</span>
                    <span id="summary-service" class="font-medium text-slate-900 text-right max-w-[150px] leading-tight">...</span>
                </div>
                <div class="flex justify-between items-center mt-3 pt-2 border-t border-blue-200">
                    <span class="font-bold text-slate-900">Total Price:</span>
                    <span id="summary-price" class="text-lg font-bold text-blue-600">₹0</span>
                </div>
            </div>

            <!-- Form -->
            <form id="orderForm" onsubmit="submitForm(event)" class="space-y-4 bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                
                <div>
                    <label for="contactInfo" class="block text-sm font-medium text-slate-700 mb-1">Mobile Number / Gmail ID *</label>
                    <input type="text" id="contactInfo" required placeholder="Enter number or email" 
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                </div>

                <div>
                    <label for="designReq" class="block text-sm font-medium text-slate-700 mb-1">आपको जैसा Design चाहिए, उसके बारे में बताएं *</label>
                    <textarea id="designReq" required rows="4" placeholder="Example: Mujhe simple black and gold logo chahiye. Name: XYZ Salon." 
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"></textarea>
                </div>

                <div>
                    <label for="extraInfo" class="block text-sm font-medium text-slate-700 mb-1">Additional Information (Optional)</label>
                    <input type="text" id="extraInfo" placeholder="Any specific colours, text, or photos?" 
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                </div>

                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 px-4 rounded-lg flex items-center justify-center gap-2 tap-card mt-2 shadow-md shadow-green-200 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                    </svg>
                    WhatsApp पर भेजें
                </button>
            </form>
        </div>

    </main>

    <!-- Floating WhatsApp Icon -->
    <a href="https://wa.me/919926107490?text=Hello,%20mujhe%20design%20services%20ke%20baare%20mein%20jaanna%20hai" target="_blank" class="fixed bottom-6 right-6 bg-[#25D366] text-white p-4 rounded-full shadow-lg hover:bg-green-600 hover:scale-110 transition-transform z-50 flex items-center justify-center tap-card">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
        </svg>
    </a>

    <script>
        // WhatsApp Number Configuration
        const WHATSAPP_NUMBER = "919926107490"; 
        
        // Categories and Services Data
        const categories = [
            { id: "salon", icon: "💇", name: "Salon", services: [
                { name: "Poster", price: 79 },
                { name: "Offer/Festival Poster", price: 99 },
                { name: "Instagram Post", price: 59 },

            ]},
            { id: "clothing", icon: "👕", name: "Clothing Shop", services: [

                { name: "Package/Rate Card", price: 149 },
                { name: "Instagram Post", price: 79 },
                { name: "Reels Cover", price: 59 },
                { name: "WhatsApp Status", price: 49 },
                { name: "Logo", price: 299 },
                { name: "Visiting Card", price: 99 },
                { name: "Monthly 10 Designs", price: 699 }
            ]},
            { id: "makeup", icon: "💄", name: "Makeup Artist", services: [
                { name: "Makeup Poster", price: 99 },
                { name: "Bridal Package", price: 149 },
                { name: "Offer Poster", price: 99 },
                { name: "Instagram Post", price: 59 },
                { name: "Story/Status", price: 49 },
                { name: "Reels Cover", price: 59 },
                { name: "Logo", price: 199 },
                { name: "Visiting Card", price: 99 },
                { name: "Price List", price: 149 },
                { name: "Monthly 10 Designs", price: 499 }
            ]},
            { id: "restaurant", icon: "🍔", name: "Restaurant / Café", services: [
                { name: "Food Post", price: 59 },
                { name: "Offer Poster", price: 99 },
                { name: "Combo Poster", price: 99 },
                { name: "Festival Poster", price: 99 },
                { name: "WhatsApp Status", price: 49 },
                { name: "Menu Card", price: 199 },
                { name: "Logo", price: 199 },
                { name: "Visiting Card", price: 99 },
                { name: "Food Catalogue", price: 299 },
                { name: "Monthly 15 Designs", price: 699 }
            ]},
            { id: "gym", icon: "🏋️", name: "Gym", services: [
                { name: "Offer Poster", price: 99 },
                { name: "Membership Poster", price: 99 },
                { name: "Transformation Post", price: 79 },
                { name: "Instagram Post", price: 59 },
                { name: "Story/Status", price: 49 },
                { name: "Rate Card", price: 149 },
                { name: "Logo", price: 199 },
                { name: "Visiting Card", price: 99 },
                { name: "Membership Card", price: 99 },
                { name: "Monthly 10 Designs", price: 499 }
            ]},
            { id: "coaching", icon: "📚", name: "Coaching", services: [
                { name: "Admission Poster", price: 99 },
                { name: "New Batch Poster", price: 99 },
                { name: "Result/Topper Poster", price: 79 },
                { name: "Instagram Post", price: 59 },
                { name: "WhatsApp Status", price: 49 },
                { name: "Flyer", price: 149 },
                { name: "Logo", price: 199 },
                { name: "Admission Form", price: 149 },
                { name: "Banner/Flex", price: 199 },
                { name: "Monthly 10 Designs", price: 499 }
            ]},
            { id: "creator", icon: "🎥", name: "Local Creator", services: [
                { name: "YouTube Thumbnail", price: 59 },
                { name: "Premium Thumbnail", price: 99 },
                { name: "Shorts/Reels Cover", price: 49 },
                { name: "YouTube Banner", price: 149 },
                { name: "Channel Logo", price: 199 },
                { name: "Video Promotion Poster", price: 79 },
                { name: "Profile Picture", price: 99 },
                { name: "Instagram Post", price: 59 },
                { name: "Monthly 10 Thumbnails", price: 499 },
                { name: "Monthly 20 Thumbnails", price: 799 }
            ]},
            { id: "mobile", icon: "📱", name: "Mobile Shop", services: [
                { name: "Mobile Offer Poster", price: 99 },
                { name: "New Mobile Post", price: 79 },
                { name: "EMI/Exchange Poster", price: 99 },
                { name: "Festival Sale Poster", price: 99 },
                { name: "WhatsApp Status", price: 49 },
                { name: "Product Catalogue", price: 299 },
                { name: "Logo", price: 199 },
                { name: "Visiting Card", price: 99 },
                { name: "Price List", price: 149 },
                { name: "Banner/Flex", price: 199 },
                { name: "Monthly 15 Designs", price: 699 }
            ]}
        ];

        const specialPackages = [
            { 
                name: "STARTER", price: 199, 
                features: ["3 Designs", "Any Category", "1 Revision"]
            },
            { 
                name: "BUSINESS", price: 499, 
                features: ["10 Designs", "Poster + Post + Status", "2 Revisions"]
            },
            { 
                name: "MONTHLY", price: 699, 
                features: ["15 Designs", "Poster + Post + Status + Reels Cover", "For the whole month"]
            }
        ];

        // State Management
        let currentStep = 1;
        let orderData = {
            category: "",
            service: "",
            price: 0,
            isPackage: false
        };

        // Initialization
        function init() {
            renderCategories();
            renderPackages();
            updateView();
        }

        function renderCategories() {
            const grid = document.getElementById("categories-grid");
            grid.innerHTML = categories.map(cat => `
                <div onclick="selectCategory('${cat.id}')" 
                     class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col items-center justify-center gap-2 tap-card cursor-pointer hover:border-blue-400 hover:shadow-md transition-all">
                    <span class="text-3xl">${cat.icon}</span>
                    <span class="text-sm font-semibold text-slate-800 text-center">${cat.name}</span>
                </div>
            `).join('');
        }

        function renderPackages() {
            const list = document.getElementById("packages-list");
            list.innerHTML = specialPackages.map(pkg => `
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-5 text-white shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="text-lg font-bold text-blue-300 tracking-wider">${pkg.name}</h3>
                        <span class="text-xl font-bold bg-white/20 px-3 py-1 rounded-full">₹${pkg.price}</span>
                    </div>
                    <ul class="space-y-1.5 mb-5 text-sm text-slate-300">
                        ${pkg.features.map(f => `<li class="flex items-center gap-2"><svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ${f}</li>`).join('')}
                    </ul>
                    <button onclick="selectPackage('${pkg.name}', ${pkg.price})" 
                            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-lg tap-card transition-colors">
                        Choose Package
                    </button>
                </div>
            `).join('');
        }

        function renderServices(categoryId) {
            const category = categories.find(c => c.id === categoryId);
            document.getElementById("selected-category-title").innerHTML = `${category.icon} ${category.name}`;
            
            const list = document.getElementById("services-list");
            list.innerHTML = category.services.map(srv => `
                <div onclick="selectService('${srv.name}', ${srv.price})" 
                     class="bg-white rounded-xl border border-slate-200 p-4 flex justify-between items-center tap-card cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all">
                    <div class="flex-1">
                        <h4 class="font-semibold text-slate-800">${srv.name}</h4>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-blue-600 text-lg">₹${srv.price}</span>
                        <div class="bg-slate-100 p-2 rounded-lg text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectCategory(categoryId) {
            const category = categories.find(c => c.id === categoryId);
            orderData.category = category.name;
            orderData.isPackage = false;
            
            renderServices(categoryId);
            currentStep = 2;
            updateView();
        } function selectService(serviceName, price) {
            orderData.service = serviceName;
            orderData.price = price;
            
            prepareForm();
            currentStep = 3;
            updateView();
        }

        function selectPackage(packageName, price) {
            orderData.category = "Special Package";
            orderData.service = packageName + " Package";
            orderData.price = price;
            orderData.isPackage = true;
            
            prepareForm();
            currentStep = 3;
            updateView();
        }

        function prepareForm() {
            document.getElementById("summary-category").textContent = orderData.category;
            document.getElementById("summary-service").textContent = orderData.service;
            document.getElementById("summary-price").textContent = `₹${orderData.price}`;
        }

        function goBack() {
            if (currentStep === 3) {
                currentStep = orderData.isPackage ? 1 : 2;
            } else if (currentStep === 2) {
                currentStep = 1;
            }
            updateView();
        }

        function updateView() {
            document.getElementById("view-categories").classList.remove("active");
            document.getElementById("view-services").classList.remove("active");
            document.getElementById("view-form").classList.remove("active");
            
            const backBtn = document.getElementById("backBtn");
            if (currentStep === 1) {
                backBtn.classList.add("hidden");
                document.getElementById("view-categories").classList.add("active");
                window.scrollTo(0, 0);
            } else if (currentStep === 2) {
                backBtn.classList.remove("hidden");
                document.getElementById("view-services").classList.add("active");
                window.scrollTo(0, 0);
            } else if (currentStep === 3) {
                backBtn.classList.remove("hidden");
                document.getElementById("view-form").classList.add("active");
                window.scrollTo(0, 0);
            }
        }

        function submitForm(event) {
            event.preventDefault();
            
            const contact = document.getElementById("contactInfo").value.trim();
            const requirements = document.getElementById("designReq").value.trim();
            const extraInfo = document.getElementById("extraInfo").value.trim();

            if (!contact || !requirements) {
                alert("Please fill the required fields.");
                return;
            }

            let message = `Hello, mujhe design banwana hai.\n\n`;
            message += `Category: ${orderData.category}\n`;
            message += `Design: ${orderData.service}\n`;
            message += `Price: ₹${orderData.price}\n\n`;
            message += `Mobile/Gmail: ${contact}\n\n`;
            message += `Design Requirements:\n${requirements}`;
            
            if (extraInfo) {
                message += `\n\nExtra Info: ${extraInfo}`;
            }

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        window.onload = init;
      </script>
</body>
</html>
